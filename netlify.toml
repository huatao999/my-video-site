# Netlify 部署配置 - Next.js 视频站
# 必须使用 @netlify/plugin-nextjs 才能正确部署 Next.js（SSR、API 等）

[build]
  command = "npm run build"
  # 必须显式设置 publish 为子目录，否则 Netlify UI「未设置」会解析为仓库根目录，
  # 与 base 相同，触发插件错误：Your publish directory cannot be the same as the base directory.
  # 设为 .next 后由插件正确接管 SSR 部署（不是当静态站发布）。
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 必需的环境变量（请在 Netlify Site settings > Environment variables 中设置）：
# R2_ACCOUNT_ID      - Cloudflare R2 账户 ID
# R2_ACCESS_KEY_ID   - R2 Access Key ID（32 位 S3 兼容密钥）
# R2_SECRET_ACCESS_KEY - R2 Secret Access Key
# R2_BUCKET          - R2 存储桶名称（在 Cloudflare R2 控制台创建时的名称）
# R2_PREFIX          - 可选。若视频在存储桶的 my-video-site/ 子目录下，设为 "my-video-site/"
# ADMIN_PASSWORD     - 可选，后台管理员密码（用于 /admin 登录）
